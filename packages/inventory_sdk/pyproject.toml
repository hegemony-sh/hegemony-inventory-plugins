[project]
name = "hegemony-inventory-sdk"
version = "0.6.0"
description = "Public SDK for Hegemony inventory provider and object-type plugins"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
# Intentionally dependency-light: pydantic only. This package must never import
# FastAPI, SQLAlchemy, Temporal, or any Hegemony app internals so out-of-tree
# plugin wheels can depend on it without pulling the platform.
dependencies = ["pydantic>=2.7"]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-inventory-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-inventory-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-inventory-plugins/blob/main/CHANGELOG.md"

[build-system]
# Bounds chosen so uv's bundled backend satisfies it on both the dev uv (0.11.x) and
# the pinned Docker uv (0.9.x) without fetching uv_build from an index.
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_inventory_sdk"
module-root = "src"
