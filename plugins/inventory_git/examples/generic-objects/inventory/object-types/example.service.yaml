schema_version: 1
kind: object_type
id: example.service
display_name: Service
field_schema:
  type: object
  properties:
    scope:
      type: string
    port:
      type: integer
      minimum: 1
      maximum: 65535
    enabled:
      type: boolean
    owner:
      type: string
    labels:
      type: array
      items:
        type: string
    settings:
      type: object
      properties:
        tier:
          type: string
  additionalProperties: false
filters:
- scope
- port
- owner
relationships:
- rel: scope
  target_object_type: example.scope
  required: true
ui:
  columns:
  - name
  - scope
  - port
  - enabled
  - owner
  - labels
  - settings
  search_fields:
  - scope
  - owner
